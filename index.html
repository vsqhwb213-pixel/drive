<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASHA DRIVE 15GB</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
        header { padding: 20px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007bff; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; }
        .file-info { display: flex; align-items: center; gap: 12px; flex: 1; cursor: pointer; }
        .dots { font-size: 30px; padding: 0 15px; color: #666; cursor: pointer; }
        
        /* Мобильное меню снизу */
        #menu { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; 
            border-top: 3px solid #007bff; border-radius: 20px 20px 0 0; 
            display: none; z-index: 1000; box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
        .menu-btn { padding: 18px; text-align: center; border-bottom: 1px solid #222; font-size: 18px; cursor: pointer; }
        .menu-btn.delete { color: #ff4d4d; }
        .menu-btn:active { background: #333; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold; font-size:20px;">NASHA DRIVE</div>
    <button onclick="addFolder()" style="background:#007bff; color:#fff; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">+ ПАПКА</button>
</header>

<div id="fileList"></div>

<div id="menu">
    <div class="menu-btn" onclick="execute('open')">Открыть / Воспроизвести</div>
    <div class="menu-btn" onclick="execute('rename')">Переименовать</div>
    <div class="menu-btn" onclick="execute('move')">Переместить</div>
    <div class="menu-btn" onclick="execute('replace')">Заменить</div>
    <div class="menu-btn delete" onclick="execute('delete')">Удалить</div>
    <div class="menu-btn" onclick="closeMenu()" style="background:#000;">ОТМЕНА</div>
</div>

<script>
let currentFile = null;

// БАЗА: Поддержка всех форматов (Видео, Фото, Аудио, PDF, Архивы)
const myFiles = [
    { name: "Мой_Фильм.mp4", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
    { name: "Фото_Профиля.jpg", url: "https://via.placeholder.com/300" },
    { name: "Документ.pdf", url: "#" },
    { name: "Музыка.mp3", url: "#" },
    { name: "Архив.zip", url: "#" }
];

// Умные иконки
function getIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    if (['mp4','mov','avi','mkv','webm'].includes(ext)) return "🎬";
    if (['mp3','wav','ogg','flac'].includes(ext)) return "🎵";
    if (['jpg','jpeg','png','gif','webp'].includes(ext)) return "🖼️";
    if (ext === 'pdf') return "📕";
    if (['zip','rar','7z','tar'].includes(ext)) return "📦";
    if (['txt','js','html','css'].includes(ext)) return "📝";
    return "📄";
}

function render() {
    const list = document.getElementById('fileList');
    list.innerHTML = "";
    myFiles.forEach((file, i) => {
        let div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
            <div class="file-info" onclick="openFile(${i})">
                <span style="font-size:24px;">${getIcon(file.name)}</span>
                <span>${file.name}</span>
            </div>
            <div class="dots" onclick="openOptions(event, ${i})">⋮</div>
        `;
        list.appendChild(div);
    });
}

function openFile(i) {
    const file = myFiles[i];
    if (file.url !== "#") {
        window.open(file.url, '_blank');
    } else {
        alert("Файл '" + file.name + "' пока не имеет ссылки на Google Диск");
    }
}

function openOptions(e, i) {
    e.stopPropagation();
    currentFile = i;
    document.getElementById('menu').style.display = 'block';
}

function closeMenu() {
    document.getElementById('menu').style.display = 'none';
}

function execute(action) {
    const file = myFiles[currentFile];
    if (action === 'open') openFile(currentFile);
    if (action === 'rename') {
        let n = prompt("Новое имя (Лимит 93050):", file.name);
        if (n && n.length <= 93050) { file.name = n; render(); }
    }
    if (action === 'delete') {
        if(confirm("Удалить файл навсегда?")) { myFiles.splice(currentFile, 1); render(); }
    }
    if (action === 'move' || action === 'replace') alert("Функция переезда файла активна для 15GB");
    closeMenu();
}

function addFolder() {
    let n = prompt("Имя папки (Лимит 93050):");
    if (n && n.length <= 93050) {
        myFiles.push({name: "📁 " + n, url: "#"});
        render();
    }
}

// Стартуем
render();
</script>

</body>
</html>
