<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASHA DRIVE CORE</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
        header { padding: 20px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007bff; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; }
        .dots { font-size: 30px; padding: 0 15px; color: #666; cursor: pointer; }
        #menu { position: fixed; bottom: 0; left:0; width: 100%; background: #1a1a1a; border-top: 3px solid #007bff; display: none; z-index: 1000; }
        .menu-btn { padding: 18px; text-align: center; border-bottom: 1px solid #222; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <strong>NASHA DRIVE (15GB)</strong>
    <button onclick="addNewFile()" style="background:#007bff; color:#fff; border:none; padding:10px 15px; border-radius:8px;">+ ДОБАВИТЬ ССЫЛКУ</button>
</header>

<div id="fileList"></div>

<div id="menu">
    <div class="menu-btn" onclick="execute('open')">ОТКРЫТЬ (ПЛЕЕР)</div>
    <div class="menu-btn" onclick="execute('rename')">ПЕРЕИМЕНОВАТЬ</div>
    <div class="menu-btn" onclick="execute('delete')" style="color:red">УДАЛИТЬ</div>
    <div class="menu-btn" onclick="closeMenu()" style="background:#000;">ОТМЕНА</div>
</div>

<script>
let currentFile = null;
// Теперь храним только ссылки, чтобы ничего не ломалось и не исчезало
let files = JSON.parse(localStorage.getItem('nasha_links')) || [];

function render() {
    const list = document.getElementById('fileList');
    list.innerHTML = files.length ? "" : '<div style="padding:50px; text-align:center; opacity:0.3;">НЕТ ФАЙЛОВ</div>';
    files.forEach((f, i) => {
        let div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
            <div style="flex:1" onclick="executeAction('open', ${i})">
                <span style="font-size:20px; margin-right:10px;">📦</span>
                <span>${f.name}</span>
            </div>
            <div class="dots" onclick="openOptions(event, ${i})">⋮</div>
        `;
        list.appendChild(div);
    });
    localStorage.setItem('nasha_links', JSON.stringify(files));
}

function addNewFile() {
    let name = prompt("Название файла:");
    if (!name) return;
    let url = prompt("Вставь ссылку на файл (из Google Диска или любую прямую):");
    if (url && name.length <= 93050) {
        files.push({ name: name, url: url });
        render();
    }
}

function openOptions(e, i) {
    e.stopPropagation();
    currentFile = i;
    document.getElementById('menu').style.display = 'block';
}

function closeMenu() { document.getElementById('menu').style.display = 'none'; }

function execute(action) {
    const file = files[currentFile];
    if (action === 'open') {
        // Открываем файл в новой вкладке — так видео и PDF работают всегда
        window.open(file.url, '_blank');
    }
    if (action === 'delete') { files.splice(currentFile, 1); render(); }
    if (action === 'rename') {
        let n = prompt("Новое имя:", file.name);
        if (n && n.length <= 93050) { file.name = n; render(); }
    }
    closeMenu();
}

render();
</script>
</body>
</html>
